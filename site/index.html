<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BetaRox is a standalone browser-based music editor in the BeepBox family.">
  <link rel="icon" type="image/svg+xml" href="/betarox-icon.svg">
  <title>BetaRox</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121218;color:#eee;font:16px/1.5 system-ui,sans-serif}
    main{width:min(34rem,calc(100% - 3rem));padding:2rem;box-sizing:border-box;border:1px solid #393946;border-radius:12px;background:#1d1d27;text-align:center}
    h1{margin:.2rem 0;color:#e7c56c}
    p{color:#c8c8d0}
    a{display:inline-block;margin:.5rem;padding:.65rem 1.1rem;border:1px solid #777;border-radius:6px;color:#eee;text-decoration:none}
    a.primary{background:#e7c56c;border-color:#e7c56c;color:#161616;font-weight:600}
    small{display:block;margin-top:1.5rem;color:#999}
  </style>
</head>
<body><main>
  <h1>BetaRox</h1>
  <p>A standalone music editor in the BeepBox family.</p>
  <a class="primary" href="/editor/">Open BetaRox</a>
  <a href="/editor/player/">Exploration Lab</a>
  <small>Built upon GoldBox, JummBox, and BeepBox. <a href="/credits/">Acknowledgments and licenses</a></small>
</main></body>
</html>
